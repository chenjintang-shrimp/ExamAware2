name: Sync ExamAware Images to ACR

on:
  # 当你 Sync Fork 后，如果上游发了新 Tag，你的 Fork 也会收到这个 Tag
  push:
    tags:
      - 'control-v*'
  
  # 也支持手动触发，方便补推历史版本
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 control-v1.0.0)'
        required: true
        type: string

env:
  # 上游镜像源（优先用 1ms 加速，国内 Action Runner 拉取更快）
  UPSTREAM_REGISTRY: ghcr.io
  # 你的阿里云 ACR 地址（请替换为你自己的）
  ACR_REGISTRY: crpi-9m68ed5xkl20hfdh.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: examaware

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull, Tag & Push control-server
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SRC="${{ env.UPSTREAM_REGISTRY }}/examaware/control-server:${TAG}"
          DST="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/control-server:${TAG}"
          
          echo "🔄 Syncing: ${SRC} → ${DST}"
          docker pull "${SRC}"
          docker tag "${SRC}" "${DST}"
          docker push "${DST}"

      - name: Pull, Tag & Push control-console
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SRC="${{ env.UPSTREAM_REGISTRY }}/examaware/control-console:${TAG}"
          DST="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/control-console:${TAG}"
          
          echo "🔄 Syncing: ${SRC} → ${DST}"
          docker pull "${SRC}"
          docker tag "${SRC}" "${DST}"
          docker push "${DST}"

      - name: Summary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "✅ Successfully synced ${TAG} to ACR" >> "$GITHUB_STEP_SUMMARY"
          echo "- control-server" >> "$GITHUB_STEP_SUMMARY"
          echo "- control-console" >> "$GITHUB_STEP_SUMMARY"
